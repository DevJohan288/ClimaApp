<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Clima actual y pronóstico de cinco días para cualquier ciudad." />
    <meta name="color-scheme" content="light dark" />
    <title>Clima por ciudad</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <main id="app" class="app">
      <section class="sky" aria-label="Búsqueda y clima actual">
        <div class="sky__top">
          <h1>Clima</h1>
          <form id="search-form" class="search" role="search">
            <label for="city">Ciudad</label>
            <div class="search__row">
              <input id="city" name="city" type="search" autocomplete="off" required minlength="2" />
              <button type="submit">Buscar</button>
            </div>
          </form>
          <p id="status" class="status" role="status"></p>
        </div>

        <div id="current" class="current" hidden></div>
      </section>

      <section class="outlook" aria-label="Pronóstico">
        <div id="forecast" class="forecast" hidden></div>
        <p class="credit">Datos de <a href="https://open-meteo.com/">Open-Meteo</a></p>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
